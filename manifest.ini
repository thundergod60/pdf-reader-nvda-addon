name = pdfReader
summary = "PDF reader"
description = """A powerful NVDA add-on for accessible PDF reading with full navigation support.

Developed by Sujan Rai, this add-on allows you to read your PDF files directly within the NVDA screen reader. 

Note: This addon is now maintained by Vatsal Gautam, and the author of this addon, Sujan Rai, might've abandoned it. If he wish to revive it back, I'll contribute

Often, we need to read PDF files, but uploading them to external servers can compromise your privacy. This add-on ensures that your PDFs are processed entirely locally, keeping your documents safe.

For feedback and support, email: blindtechvisionary@gmail.com
Join our official Telegram channel for more resources: https://t.me/blindtechvisionary

For feedback or issues on the latest update of this addon and upcoming future ones, please contact me at: vatshalgamer@gmail.com
Thank you for using this add-on!"""
author = "Sujan rai <blindtechvisionary@gmail.com>, with the current maintainer Vatsal Gautam"
